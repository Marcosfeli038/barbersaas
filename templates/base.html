<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BarberAgenda{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --txt:#e8eaf0; --mut:#9aa3b2; --acc:#d4a24c; --ok:#3fb27f; --bad:#e5645c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); line-height:1.5; }
    a { color: var(--acc); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
    header.top { border-bottom:1px solid var(--line); }
    header.top .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    header.top nav a { margin-left:14px; text-decoration:none; }
    .brand { font-weight:700; color:var(--txt); text-decoration:none; font-size:1.1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:14px 0; }
    h1,h2,h3 { margin:.2em 0 .5em; }
    label { display:block; margin:10px 0 4px; color:var(--mut); font-size:.9rem; }
    input, select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--txt); font-size:1rem; }
    button, .btn { display:inline-block; background:var(--acc); color:#1a1405; border:0; padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer; text-decoration:none; font-size:.95rem; }
    .btn.sec { background:transparent; color:var(--txt); border:1px solid var(--line); }
    .btn.ok { background:var(--ok); color:#06150e; }
    .btn.bad { background:var(--bad); color:#1d0806; }
    .btn.sm, button.sm { padding:6px 10px; font-size:.85rem; }
    .slots { display:flex; flex-wrap:wrap; gap:8px; }
    .slots label.slot { margin:0; padding:8px 12px; border:1px solid var(--line); border-radius:8px; cursor:pointer; color:var(--txt); }
    .slots input[type=radio] { display:none; }
    .slots input[type=radio]:checked + span { color:var(--acc); font-weight:700; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > * { flex: 1 1 140px; }
    .muted { color:var(--mut); }
    .msg { padding:10px 14px; border-radius:8px; margin:10px 0; }
    .msg.success { background:#12301f; border:1px solid var(--ok); }
    .msg.info { background:#17202e; border:1px solid var(--line); }
    .msg.error { background:#3a1715; border:1px solid var(--bad); }
    .tag { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--mut); }
    .item { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 0; border-top:1px solid var(--line); }
    .item:first-child { border-top:0; }
    form.inline { display:inline; }
    .errorlist { color:var(--bad); list-style:none; padding:0; margin:4px 0; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="{% url 'home' %}">✂ BarberAgenda</a>
      <nav>
        {% if user.is_authenticated %}
          <a href="{% url 'painel' %}">Agenda</a>
          <a href="{% url 'configuracoes' %}">Configurações</a>
          <a href="{% url 'assinatura' %}">Assinatura</a>
          <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn sec sm" type="submit">Sair</button></form>
        {% else %}
          <a href="{% url 'login' %}">Entrar</a>
          <a href="{% url 'cadastro' %}">Teste grátis</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
